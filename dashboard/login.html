<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - تسجيل الدخول | ماراثون الدوحة 2027</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

    :root {
      --primary: #087cf4;
      --primary-dark: #0056b3;
      --danger: #ed1c24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b1120;
      overflow: hidden;
      position: relative;
    }

    /* Cinematic Animated Background */
    .cinematic-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a2a42 0%, #0b1120 100%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 20s infinite ease-in-out alternate;
      opacity: 0.6;
    }

    .orb-1 {
      width: 400px; height: 400px;
      background: rgba(8, 124, 244, 0.4);
      top: -100px; left: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 500px; height: 500px;
      background: rgba(100, 50, 250, 0.3);
      bottom: -150px; right: -150px;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 300px; height: 300px;
      background: rgba(237, 28, 36, 0.2);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-30px, 50px) scale(0.9); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .stars {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 160px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: twinkle 5s infinite linear;
      opacity: 0.3;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; }
      50% { opacity: 0.5; }
      100% { opacity: 0.2; }
    }

    /* Glassmorphism Card */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: translateY(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .login-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
    }

    .login-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .login-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
    }

    .login-header h1 {
      font-size: 28px;
      color: #fff;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    .login-header p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-group input:focus {
      background: rgba(0, 0, 0, 0.3);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(8, 124, 244, 0.1);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .login-error {
      background: rgba(237, 28, 36, 0.15);
      color: #ff6b6b;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid rgba(237, 28, 36, 0.3);
      backdrop-filter: blur(5px);
    }
    
    .hidden { display: none; }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), #00d2ff);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(8, 124, 244, 0.3);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(8, 124, 244, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      cursor: not-allowed;
      box-shadow: none;
    }
    
    /* Input Icons Support (Optional but adds premium feel) */
    .input-icon-wrap {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="cinematic-bg">
    <div class="stars"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="/dashboard/assets/logo.png" alt="ماراثون الدوحة" class="login-logo">
        <h1>لوحة التحكم</h1>
        <p>نظام إدارة ماراثون الدوحة 2027</p>
      </div>
      
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
        </div>
        
        <div id="login-error" class="login-error hidden"></div>
        
        <button type="submit" class="login-btn">تسجيل الدخول</button>
      </form>
    </div>
  <script src="/api/env-config.js"></script>
  <script src="/dashboard/js/config.js"></script>
  <script src="/dashboard/js/login.js?v=2"></script>
</body>
</html>
