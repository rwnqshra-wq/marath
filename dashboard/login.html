<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - تسجيل الدخول | ماراثون الدوحة 2027</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Chakra+Petch:wght@500;700&display=swap');

    :root {
      --tartan-red: #9e1b20;
      --tartan-dark: #660f13;
      --tartan-light: #c42329;
      --track-line: rgba(255, 255, 255, 0.85);
      --qatar-maroon: #8a1538;
      --accent-gold: #ffb703;
      --accent-cyan: #00f0ff;
      --bg-stadium: #060911;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-stadium);
      overflow: hidden;
      position: relative;
    }

    /* Stadium & Running Arena Atmosphere */
    .stadium-arena {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #181d30 0%, #080c16 65%, #03050a 100%);
    }

    /* Olympic Stadium Floodlights */
    .floodlight {
      position: absolute;
      top: -120px;
      width: 480px;
      height: 700px;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.55;
    }
    .floodlight-left {
      left: -100px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.28) 0%, rgba(8, 124, 244, 0.12) 50%, transparent 80%);
      transform: rotate(25deg);
    }
    .floodlight-right {
      right: -100px;
      background: radial-gradient(circle, rgba(237, 28, 36, 0.35) 0%, rgba(255, 183, 3, 0.15) 50%, transparent 80%);
      transform: rotate(-25deg);
    }

    /* Authentic Tartan Running Track (مضمار الجري الترتان الأولمبي) */
    .tartan-track-container {
      position: absolute;
      bottom: -140px;
      left: 50%;
      transform: translateX(-50%) perspective(500px) rotateX(62deg);
      width: 1600px;
      height: 850px;
      background: linear-gradient(180deg, #7c1419 0%, #a82228 35%, #88161b 70%, #520b0f 100%);
      border-radius: 400px 400px 0 0;
      border: 8px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 -20px 80px rgba(237, 28, 36, 0.4),
        inset 0 0 100px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      pointer-events: none;
    }

    /* Tartan Surface Texture Grain */
    .tartan-track-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08) 1px, transparent 1px),
        radial-gradient(circle at 20% 30%, rgba(0,0,0,0.15) 1px, transparent 1px);
      background-size: 8px 8px, 12px 12px;
      opacity: 0.6;
    }

    /* Solid White Running Lanes (مسارات الجري المتوازية) */
    .running-lane {
      position: absolute;
      top: 0; bottom: 0;
      width: 3px;
      background: var(--track-line);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
    .lane-line-1 { left: 14%; }
    .lane-line-2 { left: 26%; }
    .lane-line-3 { left: 38%; }
    .lane-line-4 { left: 50%; }
    .lane-line-5 { left: 62%; }
    .lane-line-6 { left: 74%; }
    .lane-line-7 { left: 86%; }

    /* Lane Numbers Painted On Track (أرقام الحارات الرياضية) */
    .lane-number {
      position: absolute;
      bottom: 220px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 72px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      transform: translateX(-50%) rotate(-4deg);
      user-select: none;
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      width: 80px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .num-1 { left: 20%; }
    .num-2 { left: 32%; }
    .num-3 { left: 44%; }
    .num-4 { left: 56%; }
    .num-5 { left: 68%; }
    .num-6 { left: 80%; }

    /* Checkered Finish Line Banner (خط النهاية والشطرنج الرياضي) */
    .finish-line {
      position: absolute;
      bottom: 120px;
      left: 0; right: 0;
      height: 24px;
      background-image: linear-gradient(45deg, #fff 25%, #111 25%, #111 50%, #fff 50%, #fff 75%, #111 75%, #111 100%);
      background-size: 24px 24px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 50px rgba(237, 28, 36, 0.5);
      opacity: 0.85;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .start-finish-text {
      position: absolute;
      bottom: 150px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Chakra Petch', 'Cairo', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 12px;
      color: #fff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.9), 0 0 30px #ed1c24;
      white-space: nowrap;
    }

    /* Animated Runners Silhouettes with Energetic Speed Trails */
    .runner-stream {
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }
    .runner-1 {
      bottom: 160px;
      right: -120px;
      animation: sprintAcross 6s infinite linear;
      font-size: 32px;
      color: #ffb703;
      filter: drop-shadow(0 0 16px #ffb703);
    }
    .runner-2 {
      bottom: 230px;
      right: -160px;
      animation: sprintAcross 7.5s infinite linear 1.8s;
      font-size: 26px;
      color: #00f0ff;
      filter: drop-shadow(0 0 14px #00f0ff);
    }
    .runner-3 {
      bottom: 290px;
      right: -140px;
      animation: sprintAcross 9s infinite linear 3.6s;
      font-size: 22px;
      color: #ffffff;
      filter: drop-shadow(0 0 12px #ff2e43);
    }

    @keyframes sprintAcross {
      0% { transform: translateX(0) scaleX(-1); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateX(-140vw) scaleX(-1); opacity: 0; }
    }

    /* Official Race Header Stopwatch (ساعة توقيت الماراثون الرقمية) */
    .marathon-timer-bar {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(14, 20, 36, 0.85);
      border: 1px solid rgba(255, 183, 3, 0.4);
      box-shadow: 0 0 25px rgba(255, 183, 3, 0.2), inset 0 0 15px rgba(0,0,0,0.5);
      border-radius: 999px;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(16px);
      white-space: nowrap;
    }
    .timer-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffb703;
      font-weight: 700;
      font-size: 13px;
    }
    .timer-label i {
      animation: spinTick 2s infinite linear;
    }
    @keyframes spinTick {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .digital-clock {
      font-family: 'Chakra Petch', monospace;
      font-size: 20px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }
    .race-distance {
      background: rgba(237, 28, 36, 0.25);
      border: 1px solid rgba(237, 28, 36, 0.6);
      color: #fff;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    /* Glassmorphic VIP Race Official Login Card */
    .login-container {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      margin-top: 50px;
    }

    .login-card {
      background: rgba(10, 15, 28, 0.82);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 38px 32px;
      box-shadow: 
        0 30px 80px -15px rgba(0, 0, 0, 0.9), 
        0 0 40px rgba(237, 28, 36, 0.25);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Tartan Gold & Crimson Shimmer Border */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ed1c24, #ffb703, #00f0ff, #ed1c24);
      background-size: 200% 100%;
      animation: ribbonFlow 3.5s linear infinite;
    }

    @keyframes ribbonFlow {
      0% { background-position: 0% 0%; }
      100% { background-position: 200% 0%; }
    }

    .login-card:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 35px 90px -15px rgba(0, 0, 0, 0.95), 
        0 0 50px rgba(237, 28, 36, 0.35);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .marathon-bib-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      border-radius: 8px;
      background: rgba(255, 183, 3, 0.12);
      border: 1px solid rgba(255, 183, 3, 0.4);
      color: #ffb703;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 14px;
      font-family: 'Chakra Petch', 'Cairo', sans-serif;
    }
    .marathon-bib-badge i {
      color: #ed1c24;
    }

    .login-logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 16px rgba(237, 28, 36, 0.4));
      animation: logoPulse 4s ease-in-out infinite alternate;
    }

    @keyframes logoPulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(237, 28, 36, 0.3)); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 22px rgba(255, 183, 3, 0.5)); }
    }

    .login-header h1 {
      font-size: 25px;
      color: #ffffff;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.2px;
    }

    .login-header p {
      color: rgba(255, 255, 255, 0.65);
      font-size: 13.5px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      right: 14px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 16px;
      transition: color 0.3s;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 13px 42px 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(5, 8, 16, 0.6);
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-group input:focus {
      background: rgba(5, 8, 16, 0.9);
      border-color: #ed1c24;
      box-shadow: 0 0 0 4px rgba(237, 28, 36, 0.2);
    }

    .form-group input:focus + .input-icon {
      color: #ed1c24;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-weight: 500;
    }

    .login-error {
      background: rgba(237, 28, 36, 0.2);
      color: #ff757d;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid rgba(237, 28, 36, 0.45);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .hidden { display: none !important; }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ed1c24 0%, #a01016 50%, #ff4d4d 100%);
      background-size: 200% auto;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 22px rgba(237, 28, 36, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-btn:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(237, 28, 36, 0.6);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
      box-shadow: none;
    }

    .login-footer-info {
      text-align: center;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      font-weight: 600;
    }

    .login-footer-info span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 600px) {
      .marathon-timer-bar {
        padding: 6px 14px;
        gap: 8px;
        top: 12px;
      }
      .digital-clock { font-size: 16px; }
      .timer-label { font-size: 11px; }
      .login-card { padding: 30px 22px; }
      .tartan-track-container { bottom: -180px; }
    }
  </style>
</head>
<body>
  <!-- Stadium Floodlights & Atmosphere -->
  <div class="stadium-arena">
    <div class="floodlight floodlight-left"></div>
    <div class="floodlight floodlight-right"></div>

    <!-- Authentic Tartan Running Track with Lanes & Numbers -->
    <div class="tartan-track-container">
      <div class="running-lane lane-line-1"></div>
      <div class="running-lane lane-line-2"></div>
      <div class="running-lane lane-line-3"></div>
      <div class="running-lane lane-line-4"></div>
      <div class="running-lane lane-line-5"></div>
      <div class="running-lane lane-line-6"></div>
      <div class="running-lane lane-line-7"></div>

      <!-- Painted Athletic Lane Numbers -->
      <div class="lane-number num-1">1</div>
      <div class="lane-number num-2">2</div>
      <div class="lane-number num-3">3</div>
      <div class="lane-number num-4">4</div>
      <div class="lane-number num-5">5</div>
      <div class="lane-number num-6">6</div>

      <!-- Start / Finish Line -->
      <div class="finish-line"></div>
      <div class="start-finish-text">START • FINISH • START</div>
    </div>

    <!-- Sprinting Marathon Runners -->
    <div class="runner-stream runner-1">
      <i class="fas fa-running"></i>
    </div>
    <div class="runner-stream runner-2">
      <i class="fas fa-running"></i>
    </div>
    <div class="runner-stream runner-3">
      <i class="fas fa-running"></i>
    </div>
  </div>

  <!-- Official Race Digital Timer -->
  <div class="marathon-timer-bar">
    <div class="timer-label">
      <i class="fas fa-stopwatch"></i>
      <span>توقيت السباق المباشر</span>
    </div>
    <div class="digital-clock" id="race-clock">02:04:18.42</div>
    <div class="race-distance">42.195 KM</div>
  </div>

  <!-- VIP Race Official Login Box -->
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="marathon-bib-badge">
          <i class="fas fa-medal"></i>
          <span>DOHA MARATHON 2027 • OFFICIAL ACCESS</span>
        </div>
        <img src="assets/logo.png" alt="ماراثون الدوحة" class="login-logo">
        <h1>لوحة تحكم السباق</h1>
        <p>نظام إدارة ومتابعة المتسابقين المباشر</p>
      </div>
      
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">
            <i class="fas fa-user-shield" style="color: #ed1c24;"></i>
            <span>اسم المستخدم</span>
          </label>
          <div class="input-wrapper">
            <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
            <i class="fas fa-user input-icon"></i>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock" style="color: #ffb703;"></i>
            <span>كلمة المرور</span>
          </label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            <i class="fas fa-key input-icon"></i>
          </div>
        </div>
        
        <div id="login-error" class="login-error hidden">
          <i class="fas fa-exclamation-triangle"></i>
          <span></span>
        </div>
        
        <button type="submit" class="login-btn">
          <i class="fas fa-flag-checkered"></i>
          <span>انطلاق إلى لوحة التحكم</span>
        </button>
      </form>

      <div class="login-footer-info">
        <span><i class="fas fa-running" style="color:#ed1c24;"></i> تتبع المتسابقين</span>
        <span>•</span>
        <span><i class="fas fa-shield-alt" style="color:#ffb703;"></i> اتصال مباشر ومشفّر</span>
      </div>
    </div>
  </div>
  
  <script>
    // Live ticking athletic race stopwatch
    (function initRaceTimer() {
      const clockEl = document.getElementById('race-clock');
      if (!clockEl) return;
      let hours = 2, minutes = 4, seconds = 18, ms = 42;
      setInterval(() => {
        ms += 7;
        if (ms >= 100) { ms = 0; seconds++; }
        if (seconds >= 60) { seconds = 0; minutes++; }
        if (minutes >= 60) { minutes = 0; hours++; }
        const pad = (n, len = 2) => String(n).padStart(len, '0');
        clockEl.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(ms)}`;
      }, 70);
    })();
  </script>
  <script src="js/config.js"></script>
  <script src="js/login.js?v=8"></script>
</body>
</html>
